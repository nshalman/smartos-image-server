[package]
name = "smartos-image-server"
version = "0.2.0"
authors = ["Nahum Shalman <nahamu@gmail.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1"
dropshot = { git = "https://github.com/nshalman/dropshot", branch = "otel-tracing" }
getopts = "0.2"
schemars = { version = "0.8", features = [ "uuid" ] }
serde = { version = "1.0.0", features = [ "derive" ]}
serde_json = "1"
tokio = { version = "1", features = [ "full" ] }
uuid = { version = "0.8.0", features = [ "serde", "v4" ] }
slog = { version = "2.5.0", features = [ "max_level_trace", "release_max_level_debug" ] }
slog-async = "2.4.0"
slog-bunyan = "2.2.0"
slog-json = "2.3.0"
slog-term = "2.5.0"
tokio-util = { version = "0.7", features = ["codec", "io"] }
futures = "0.3"
semver = "1.0"
http = "1.0"
hyper-staticfile = "0.10"
mime_guess = "2.0"
md5 = "0.7"
base64 = "0.21"

[dev-dependencies]
tempfile = "3.8"
reqwest = { version = "0.11", features = ["json"] }
